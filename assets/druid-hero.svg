<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Druid: Agentic Engineering OS</title>
  <desc id="desc">Low-touch agents for repo risk discovery, PR maintenance, and review-loop automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071017"/>
      <stop offset="0.55" stop-color="#0B1320"/>
      <stop offset="1" stop-color="#061B1D"/>
    </linearGradient>
    <linearGradient id="line" x1="110" y1="105" x2="1030" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66E3C4"/>
      <stop offset="0.5" stop-color="#6EA8FF"/>
      <stop offset="1" stop-color="#B6F35B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.25 0 0 0 0 0.95 0 0 0 0 0.82 0 0 0 0.45 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="26" fill="url(#bg)"/>
  <path d="M0 92H1200M0 188H1200M0 284H1200M0 380H1200M120 0V480M300 0V480M480 0V480M660 0V480M840 0V480M1020 0V480" stroke="#173244" stroke-opacity="0.35"/>
  <rect x="44" y="42" width="1112" height="396" rx="24" stroke="#263F52" stroke-width="2"/>

  <g opacity="0.8">
    <path d="M122 333C226 241 319 292 428 207C548 113 631 163 742 222C842 275 925 255 1042 142" stroke="url(#line)" stroke-width="3" filter="url(#glow)"/>
    <circle cx="122" cy="333" r="7" fill="#66E3C4"/>
    <circle cx="428" cy="207" r="7" fill="#6EA8FF"/>
    <circle cx="742" cy="222" r="7" fill="#B6F35B"/>
    <circle cx="1042" cy="142" r="7" fill="#66E3C4"/>
  </g>

  <g>
    <rect x="76" y="74" width="610" height="212" rx="18" fill="#0C1721" stroke="#294154"/>
    <text x="106" y="121" fill="#66E3C4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1.5">COMMAND CENTER / YONGSHAN YU</text>
    <text x="106" y="163" fill="#F3F7FB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="46" font-weight="800">Druid</text>
    <text x="106" y="207" fill="#F3F7FB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="300">Agentic Engineering OS</text>
    <text x="106" y="244" fill="#A9BBCB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">Low-touch agents for repo risk discovery,</text>
    <text x="106" y="270" fill="#A9BBCB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">PR maintenance, and review-loop automation.</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="734" y="74" width="378" height="84" rx="16" fill="#0D1B26" stroke="#294154"/>
    <text x="752" y="109" fill="#66E3C4" font-size="15" font-weight="700">36-PR RUSTCHAIN QUEUE</text>
    <text x="752" y="136" fill="#DDE7F0" font-size="18">test-backed review evidence</text>

    <rect x="734" y="178" width="378" height="84" rx="16" fill="#0D1B26" stroke="#294154"/>
    <text x="752" y="213" fill="#6EA8FF" font-size="15" font-weight="700">PATCH + TEST PORTFOLIO</text>
    <text x="752" y="240" fill="#DDE7F0" font-size="18">small scoped PRs with risk notes</text>

    <rect x="734" y="282" width="378" height="96" rx="16" fill="#0D1B26" stroke="#294154"/>
    <text x="752" y="317" fill="#B6F35B" font-size="15" font-weight="700">CORE RISK SURFACES</text>
    <text x="752" y="344" fill="#DDE7F0" font-size="18">payout / bridge / UTXO / governance</text>
    <text x="752" y="369" fill="#DDE7F0" font-size="18">security / reliability</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <rect x="76" y="312" width="604" height="78" rx="16" fill="#09131B" stroke="#294154"/>
    <text x="104" y="345" fill="#66E3C4">Issue discovery</text>
    <text x="255" y="345" fill="#718393">-&gt;</text>
    <text x="292" y="345" fill="#6EA8FF">Risk classification</text>
    <text x="500" y="345" fill="#718393">-&gt;</text>
    <text x="537" y="345" fill="#B6F35B">Tests</text>
    <text x="104" y="374" fill="#A9BBCB">Review tracking -&gt; adaptive memory -&gt; stop-loss</text>
  </g>

  <text x="78" y="420" fill="#617384" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Built by Yongshan Yu</text>
  <text x="926" y="420" fill="#617384" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">auditable / repeatable / self-improving</text>
</svg>
