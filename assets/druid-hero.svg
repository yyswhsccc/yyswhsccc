<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Druid: Agentic Engineering OS</title>
  <desc id="desc">A warm, minimal hero banner for Yongshan Yu's Druid agent framework.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7f0"/>
      <stop offset="0.56" stop-color="#f7efe5"/>
      <stop offset="1" stop-color="#efe3d5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c86f55"/>
      <stop offset="1" stop-color="#9d6546"/>
    </linearGradient>
    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#6b4a36" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="500" rx="34" fill="url(#paper)"/>
  <path d="M0 406 C175 360 235 424 392 382 C565 336 650 180 820 214 C992 248 1042 370 1200 318 L1200 500 L0 500 Z" fill="#eadbc9" opacity="0.64"/>
  <path d="M96 92 H1104" stroke="#ded1c3" stroke-width="1"/>
  <path d="M96 408 H1104" stroke="#ded1c3" stroke-width="1"/>

  <g filter="url(#softShadow)">
    <rect x="74" y="74" width="1052" height="352" rx="26" fill="#fffaf3" stroke="#ded1c3"/>
  </g>

  <g transform="translate(122 112)">
    <rect x="0" y="0" width="214" height="38" rx="19" fill="#f3e7dc" stroke="#e1d1c1"/>
    <circle cx="22" cy="19" r="6" fill="#c86f55"/>
    <text x="40" y="25" fill="#5e5047" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.3">YONGSHAN YU</text>

    <text x="0" y="106" fill="#2f2a24" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="62" font-weight="780" letter-spacing="0">Druid</text>
    <text x="0" y="164" fill="#2f2a24" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="650" letter-spacing="0">Agentic Engineering OS</text>
    <text x="0" y="218" fill="#6f665c" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="500">Frameworks that make AI coding tools operate reliably</text>
    <text x="0" y="250" fill="#6f665c" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="500">inside real repositories, review loops, and CI.</text>
  </g>

  <g transform="translate(760 112)">
    <rect x="0" y="0" width="292" height="78" rx="18" fill="#fbf4ec" stroke="#decdbd"/>
    <text x="24" y="33" fill="#c86f55" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="800">36-PR</text>
    <text x="24" y="60" fill="#5e5047" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600">test-backed review queue</text>

    <rect x="0" y="104" width="292" height="78" rx="18" fill="#fbf4ec" stroke="#decdbd"/>
    <text x="24" y="137" fill="#2f2a24" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="800">Risk surfaces</text>
    <text x="24" y="164" fill="#5e5047" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600">payout / bridge / UTXO</text>

    <rect x="0" y="208" width="292" height="78" rx="18" fill="#fbf4ec" stroke="#decdbd"/>
    <text x="24" y="241" fill="#2f2a24" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="800">Low-touch</text>
    <text x="24" y="268" fill="#5e5047" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600">review tracking + memory</text>
  </g>

  <g transform="translate(122 348)">
    <rect width="338" height="38" rx="19" fill="url(#accent)"/>
    <text x="22" y="25" fill="#fffaf3" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="760">Issue discovery -> tests -> review loop</text>
  </g>
</svg>
